name: Anteprima BrisMaster 0.6.9.1
on:
  push:
    branches: [codex/anteprima-0.6.9.1]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p brismaster
      - name: Prepara archivio portatile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable
          Copy-Item target/release/brismaster.exe portable/BrisMaster-0.6.9.1.exe
          $hash = (Get-FileHash portable/BrisMaster-0.6.9.1.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BrisMaster-0.6.9.1.exe" | Set-Content portable/SHA256.txt -Encoding ascii
          Compress-Archive -Path portable/* -DestinationPath BrisMaster-0.6.9.1-Windows-x64.zip
      - name: Pubblica l'anteprima
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create 'v0.6.9.1' 'BrisMaster-0.6.9.1-Windows-x64.zip' --target "$env:GITHUB_SHA" --title 'BrisMaster 0.6.9.1 · Anteprima Windows x64' --notes-file docs/RELEASE-0.6.9.1.md --prerelease --latest=false
