name: CI

on:
  push:
    branches: [main, improve/v0.6.0-recognition-engines-ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked --release
      - name: Build app
        run: cargo build --locked --release -p brismaster
      # Lo stesso installatore della release, per accorgersi subito se lo script non compila.
      - name: Installatore
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=0.0.0" "/DExeDir=..\target\release" installer\BrisMaster.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkpoint Windows e checksum
        shell: pwsh
        run: |
          Copy-Item target/release/brismaster.exe dist/BrisMaster.exe
          $lines = @("BrisMaster.exe", "BrisMaster-Setup.exe") | ForEach-Object {
            $hash = (Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $lines | Set-Content dist/SHA256SUMS -Encoding ascii
      - name: Conserva app e installatore di questo commit
        uses: actions/upload-artifact@v4
        with:
          name: BrisMaster-Windows-${{ github.sha }}
          path: |
            dist/BrisMaster.exe
            dist/BrisMaster-Setup.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Il motore della pull request contro quello dell'ultima release, sugli stessi mazzi.
  # Fallisce se la nuova versione è significativamente più debole (IC 95% tutto sotto il 50%).
  # 5000 mazzi: il numero che serve perché il motore contro se stesso dia 50% ± 1 punto (vedi bench/RAPPORTO.md).
  regressione:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confronto con l'ultima release (livello Difficile)
        run: cargo run --locked --release -p briscola-sim -- gate --player engine:1000 --deals 5000 --seed 20261022 --summary "$GITHUB_STEP_SUMMARY"

  # Sette e mezzo: i valori esatti del risolutore devono coincidere con 200.000 mani simulate
  # e nessuna strategia deve superare quella ottimale.
  settemezzo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Calcolo esatto contro simulazione
        run: cargo run --locked --release -p settemezzo -- --hands 200000 --out "$GITHUB_STEP_SUMMARY"
