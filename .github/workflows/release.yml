name: Release

# Pubblicare una nuova versione: aggiornare `version` in Cargo.toml (es. 0.2.0)
# e fare push su main. Se la release v0.2.0 non esiste ancora, questo workflow
# compila BrisMaster.exe su Windows, crea il tag e pubblica la release.
# Le app già installate la trovano all'avvio e si aggiornano da sole.

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Leggi la versione
        id: ver
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "La release v$version esiste già, niente da fare."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.exists == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.exists == 'false'
      - name: Test
        if: steps.ver.outputs.exists == 'false'
        run: cargo test --workspace --release
      - name: Build
        if: steps.ver.outputs.exists == 'false'
        run: cargo build --release -p brismaster
      - name: Installatore
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = "${{ steps.ver.outputs.tag }}".TrimStart("v")
          & $iscc "/DAppVersion=$version" "/DExeDir=..\target\release" installer\BrisMaster.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepara i file
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          cp target/release/brismaster.exe BrisMaster.exe
          cp dist/BrisMaster-Setup.exe BrisMaster-Setup.exe
          sha256sum BrisMaster.exe > BrisMaster.exe.sha256
          sha256sum BrisMaster-Setup.exe > BrisMaster-Setup.exe.sha256
      - name: Pubblica la release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BrisMaster ${{ steps.ver.outputs.tag }}
          files: |
            BrisMaster.exe
            BrisMaster.exe.sha256
            BrisMaster-Setup.exe
            BrisMaster-Setup.exe.sha256
          body: |
            **Installazione:** scarica `BrisMaster-Setup.exe` qui sotto, nella sezione **Assets**, e aprilo: installa BrisMaster per il tuo utente (senza permessi di amministratore), con il collegamento sul desktop e nel menu Start. Si disinstalla da *Impostazioni → App*.
            In alternativa `BrisMaster.exe` è il programma da solo, senza installazione.
            Le app già installate si aggiornano anche da sole all'avvio.

            Se Windows SmartScreen avvisa: *Ulteriori informazioni → Esegui comunque*. Se l'antivirus blocca l'exe: [come sbloccarlo](https://github.com/motthz/BrisMaster/blob/main/docs/ANTIVIRUS.md).
          generate_release_notes: true
