[package]
name = "brismaster"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
briscola-core = { path = "../core" }
settemezzo = { path = "../settemezzo" }
blackjack-core = { path = "../blackjack", features = ["serde"] }
scopa-core = { path = "../scopa" }
poker-it = { path = "../poker-it" }
poker-core = { path = "../poker" }
scala40-core = { path = "../scala40" }
burraco = { path = "../burraco" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
rand = { version = "0.8", features = ["small_rng"] }
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json", "native-certs"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.9.8"
